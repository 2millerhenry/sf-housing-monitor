private_room: true
property_types:
  - house
  - townhouse
  - victorian
  - shared flat

lease:
  ideal_min_months: 3
  ideal_max_months: 8
  min_months: 1
  max_months: 12
  flexible: true

# A listing explicitly opening in August scores highest. September and October
# remain useful near-term fallbacks; anything later stays in the archive.
availability:
  preferred_by: "2026-08-31"
  latest_by: "2026-10-31"

household:
  ideal_people: 3
  min_people: 2
  max_people: 5

features:
  sunlight: true
  park_access: true
  outdoor_space: true

# Positive signals only. Their absence is unknown, not a mismatch.
lifestyle_keywords:
  - outdoorsy
  - social
  - chill
  - clean
  - mature
  - respectful
  - communicative
  - quiet
  - friendly
  - independent
  - creative
  - young professional
  - biking
  - skating
  - hybrid work
  - laundry
  - guests allowed

# Only explicit mentions trigger these penalties.
dealbreakers:
  - apartment complex
  - shared bedroom
  - shared room
  - per bed
  - per-bed

# Weights only apply when the corresponding preference is configured.
weights:
  # A known target neighborhood must outrank a perfect price in the wrong area.
  price: 20
  neighborhood: 35
  private_room: 12
  property_type: 10
  lease: 10
  availability: 12
  household: 8
  sunlight: 6
  park_access: 5
  outdoor_space: 3
  lifestyle: 3

sources:
  max_results_per_source: 120
  craigslist_detail_pages_per_scan: 10
  # Apartment cards with only a generic "San Francisco" location need their
  # detail page before they can be verified against the target neighborhoods.
  craigslist_unit_detail_pages_per_scan: 30
  # The combined 2–3 bedroom search keeps 2BR coverage broad.
  craigslist_two_bedroom_detail_pages_per_scan: 25
  # Exact 3BR search prevents newer 2BR cards from crowding 3BR inventory out.
  craigslist_three_bedroom_detail_pages_per_scan: 25
  # The dedicated sublet category is only admitted with an explicit 6+ month
  # term, and these detail reads provide the term and real home shape.
  craigslist_sublet_detail_pages_per_scan: 15
  facebook_marketplace_results_per_scan: 10
  # Furnished Finder's community connector is capped at five rooms per scheduled
  # scan and 300 returned listings per month, so it stays within free-credit scale.
  furnished_finder_results_per_scan: 5
  furnished_finder_monthly_listing_limit: 300
  # Public-only connector. Scheduled scans read five posts; manual scans and
  # the Groups test read twenty so Bay Area noise cannot crowd out SF offers.
  facebook_group_urls:
    - https://www.facebook.com/groups/1105487206638421/
