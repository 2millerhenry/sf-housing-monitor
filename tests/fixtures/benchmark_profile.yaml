# Illustrative, fully-populated deal profile used only by the ranking
# benchmark in tests/ranking_benchmark.py. It is a test fixture: the
# application never reads it, the wheel never packages it, and a real
# installation starts from a blank draft profile instead (see
# sf_housing/settings.py and sf_housing/deal_profile.py:DealProfile.blank).
# Its numbers are load-bearing for the benchmark's assertions -- changing
# them changes what the ranker is graded against. Unknown listing details
# receive neutral credit; they are never treated as confirmed negatives.
minimum_score: 60

budget:
  min_monthly: 800
  max_monthly: 2700
  ideal_monthly: 1500
  sweet_spot_min: 1200
  sweet_spot_max: 1800
  # A listing up to 5% outside the wider range is still worth reviewing.
  flexible_margin_percent: 0.05

# A separate shortlist for an entire place. It shares the neighborhood list
# below but does not apply private-room, household, or property-style rules.
whole_unit:
  enabled: true
  max_monthly: 3000
  unit_types: [studio, one_bedroom]
  # Known buildings above this size stay in the archive. Unknown size remains
  # reviewable and is labeled for manual verification.
  max_building_units: 50

# A combined whole-apartment shortlist. Each bedroom count keeps its own hard
# per-person cap; a 2-bedroom cannot borrow the higher 3-bedroom total cap.
two_bedroom:
  enabled: true
  occupants: 2
  max_per_person: 2700
  max_building_units: 50

three_bedroom:
  enabled: true
  occupants: 3
  max_per_person: 2500
  max_building_units: 50

ideal_neighborhoods:
  - Duboce Triangle
  - Potrero Hill

preferred_neighborhoods:
  - Mission Dolores
  - Bernal Heights
  - Noe Valley

acceptable_neighborhoods:
  - NOPA
  - North of the Panhandle
  - Lower Haight
  - Hayes Valley
  - Mission District
  - Eureka Valley
  - Castro
  - Glen Park
  - Inner Richmond
  - Inner Sunset
  - Richmond District
  - Inner Parkside
  - Cole Valley
  - Dogpatch
  - Pacific Heights
  - Marina

# Listing sites use inconsistent neighborhood labels. These are only aliases for
# the matching areas above; a generic "San Francisco" label remains unknown.
neighborhood_aliases:
  Duboce Triangle: [Duboce, Duboce Park]
  Potrero Hill: [Potrero]
  Mission Dolores: [Dolores Park]
  Bernal Heights: [Bernal]
  Noe Valley: [Noe]
  NOPA: [NoPa, North of Panhandle, Alamo Square]
  Eureka Valley: [Castro / Upper Market]
  Richmond District: [Central Richmond, Sea Cliff, Seacliff, Richmond / Seacliff, Outer Richmond]

# Direct Zillow room-rental searches supplied by Henry. These are the links the
# Alerts page opens when setting up Zillow Instant email notifications. Zillow
# may email up to the saved-search cap; the monitor's actual room budget remains
# $800–$2,700 above, so an over-budget listing does not enter results.
