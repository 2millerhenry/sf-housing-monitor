<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SF Housing Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v={{ app_version }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="SF Housing Monitor home">
        <span class="brand-mark" aria-hidden="true">SF</span>
        <span>Home Finder</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/" {% if request.url.path == '/' and view != 'saved' %}class="active" aria-current="page"{% endif %}>Shortlist</a>
        <a href="/?view=saved&sort=score" {% if request.url.path == '/' and view == 'saved' %}class="active" aria-current="page"{% endif %}>Saved</a>
        {% if request.url.path == '/potrero' %}<a href="/potrero" class="active" aria-current="page">Potrero Hill</a>{% endif %}
        <a href="/alerts" {% if request.url.path == '/alerts' %}class="active" aria-current="page"{% endif %}>Sources</a>
        <a href="/preferences" {% if request.url.path == '/preferences' %}class="active" aria-current="page"{% endif %}>Your deal</a>
        <a href="/support" {% if request.url.path == '/support' %}class="active" aria-current="page"{% endif %}>Support</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
